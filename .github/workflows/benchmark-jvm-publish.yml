concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-benchmark-jvm-publish"
  cancel-in-progress: true

on:
  workflow_call:

permissions:
  deployments: write
  contents: write

jobs:
  publish:
    name: Publish benchmark result
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download benchmark result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-jvm-results
          path: crypto-ffi/bindings/jvm/build/reports/jmh

      - name: Publish benchmark result to Prometheus
        env:
          VM_PASSWORD: ${{ secrets.METRICS_WRITER_PASSWORD }}
        run: |
          scripts/benchmarks-to-openmetrics.py --format jmh crypto-ffi/bindings/jvm/build/reports/jmh/results.json --extra-label target=jvm > metrics.txt
          curl -sS --fail-with-body -u "ci-writer:$VM_PASSWORD" --data-binary @metrics.txt \
              "https://monitoring.zinfra.io/prometheus/api/v1/import/prometheus?extra_label=job=core-crypto-benchmark&extra_label=repo=$GITHUB_REPOSITORY"

      - name: Publish benchmark result to GitHub pages
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: "JVM Benchmarks"
          tool: 'jmh'
          output-file-path: crypto-ffi/bindings/jvm/build/reports/jmh/results.json
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
