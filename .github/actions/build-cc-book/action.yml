name: build-cc-book
description: Install and build the cc-book mdBook

runs:
  using: composite

  steps:
    - name: Install mdBook tools
      uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
      with:
        tool: |
          mdbook@0.5.4
          mdbook-langtabs@0.2.0
          mdbook-mermaid@0.17.0

    - name: Install mdBook plugins
      shell: bash
      run: |
        mdbook-langtabs install ./cc-book
        mdbook-mermaid install ./cc-book

    - name: Build cc-book
      shell: bash
      run: mdbook build cc-book
