concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-test-jvm-${{ inputs.runs_on || 'ubuntu-latest' }}"
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      runs_on:
        type: string
        default: ubuntu-latest
  workflow_dispatch:

env:
  RELEASE: 1

jobs:
  test-jvm:
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/make/setup

      - name: set up jdk 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 25
          distribution: adopt
      - name: gradle setup
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: download linux library
        uses: ./.github/actions/make/jvm
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ vars.ARTIFACT_GENERATION }}

      - name: download aarch64 linux artifact
        if: runner.arch == 'X64'
        uses: ./.github/actions/make
        with:
          key: jvm-linux-aarch64
          make-rule: jvm-linux-aarch64
          target-path: target/aarch64-unknown-linux-gnu/release/libcore_crypto_ffi.so
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ vars.ARTIFACT_GENERATION }}

      - name: download x86_64 linux artifact
        if: runner.arch == 'ARM64'
        uses: ./.github/actions/make
        with:
          key: jvm-linux-x86-64
          make-rule: jvm-linux-x86-64
          target-path: target/x86_64-unknown-linux-gnu/release/libcore_crypto_ffi.so
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ vars.ARTIFACT_GENERATION }}

      # The specific jvm action uses `uname -s` to determine which `jvm` make rule to call.
      # Because this workflow runs on ubuntu, we're using the generic action
      - name: download aarch64 apple darwin artifact
        uses: ./.github/actions/make
        with:
          key: jvm-darwin
          make-rule: jvm-darwin
          target-path: target/aarch64-apple-darwin/release/libcore_crypto_ffi.dylib
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ vars.ARTIFACT_GENERATION }}

      - name: download kotlin bindings
        uses: ./.github/actions/make/bindings-kotlin-jvm
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ vars.ARTIFACT_GENERATION }}

      - name: build and test jvm package
        uses: ./.github/actions/make
        with:
          key: jvm-test-${{ runner.arch }}
          make-rule: jvm-test
          always-run: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ vars.ARTIFACT_GENERATION }}
