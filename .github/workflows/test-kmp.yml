concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-test-kmp-jvm"
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      artifact_generation:
        description: >
          Artifact key generation suffix, pinned by the caller so that every job in a run
          agrees on it. Falls back to `vars.ARTIFACT_GENERATION` when this workflow is
          invoked directly.
        required: false
        type: string
  workflow_dispatch:

# The libraries the jobs building them upload are release builds.
env:
  RELEASE: 1

jobs:
  test-jvm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/make/setup

      - name: set up jdk 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 25
          distribution: temurin
      - name: gradle setup
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: setup Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6.0'

      - name: download the libraries
        uses: ./.github/actions/make/kmp-libs
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}

      # The keys name the OS: each runner builds and tests different targets.
      - name: build kmp package
        uses: ./.github/actions/make
        with:
          key: kmp-${{ runner.os }}
          make-rule: kmp
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}

      - name: test kmp package
        uses: ./.github/actions/make
        with:
          key: kmp-jvm-test-${{ runner.os }}
          make-rule: kmp-jvm-test
          always-run: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}
