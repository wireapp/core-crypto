name: Release staged artifacts to maven.wire.com
description: |
  Upload a repository staged by `wire-maven/stage` earlier in the same workflow run
  to maven.wire.com. Safe to re-run after a partial failure. The calling job needs the
  `id-token: write` permission. Assumes the repository is already checked out.

inputs:
  platform:
    description: The `platform` the repository was staged with, e.g. 'jvm', 'android', 'kmp'.
    required: true

runs:
  using: composite
  steps:
    - name: download the staging repository
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: wire-maven-${{ inputs.platform }}
        path: ${{ runner.temp }}/wire-maven-${{ inputs.platform }}

    # wire-maven-infra: this role trusts only runs triggered by a `v*` tag of this repository,
    # and may write only below `com/wire/core-crypto*` in the `maven-wire-com` bucket.
    - name: configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::093205192929:role/gh-actions-maven-publish-core-crypto
        aws-region: us-east-1

    - name: release the staging repository
      shell: bash
      run: |
        scripts/wire-maven.py release "$STAGED" \
          --version "$(sed -n 's/^VERSION_NAME=//p' crypto-ffi/bindings/gradle.properties)"
      env:
        STAGED: ${{ runner.temp }}/wire-maven-${{ inputs.platform }}
