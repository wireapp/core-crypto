concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-benchmark-jvm"
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      benchmark_message_counts:
        required: false
        type: string
      benchmark_message_sizes:
        required: false
        type: string
      benchmark_user_counts:
        required: false
        type: string
      benchmark_cipher_suites:
        required: false
        type: string
      publish:
        required: false
        type: boolean
        default: true
      runs_on:
        description: JSON string or array to use for the benchmark runner
        required: false
        type: string
        default: '"ubuntu-latest"'
    secrets:
      METRICS_WRITER_PASSWORD:
        description: Password for the metrics writer used to publish to Prometheus
        required: false
  workflow_dispatch:
    inputs:
      benchmark_message_counts:
        description: Comma-separated benchmark message counts
        required: false
        type: string
      benchmark_message_sizes:
        description: Comma-separated benchmark message sizes
        required: false
        type: string
      benchmark_user_counts:
        description: Comma-separated benchmark user counts
        required: false
        type: string
      benchmark_cipher_suites:
        description: Comma-separated benchmark cipher suite IDs
        required: false
        type: string
      publish:
        description: Publish benchmark results
        required: false
        type: boolean
        default: true
      runs_on:
        description: JSON string or array to use for the benchmark runner
        required: false
        type: string
        default: '"ubuntu-latest"'

env:
  RELEASE: 1

permissions:
  # deployments permission to deploy GitHub pages website
  deployments: write
  # contents permission to update benchmark contents in gh-pages branch
  contents: write

jobs:
  benchmark:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    env:
      BENCHMARK_MESSAGE_COUNTS: ${{ inputs.benchmark_message_counts }}
      BENCHMARK_MESSAGE_SIZES: ${{ inputs.benchmark_message_sizes }}
      BENCHMARK_USER_COUNTS: ${{ inputs.benchmark_user_counts }}
      BENCHMARK_CIPHER_SUITES: ${{ inputs.benchmark_cipher_suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/make/setup

      - name: set up jdk 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 25
          distribution: adopt
      - name: gradle setup
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: download linux library
        uses: ./.github/actions/make
        with:
          key: jvm-linux
          make-rule: jvm-linux
          target-path: target/x86_64-unknown-linux-gnu/release/libcore_crypto_ffi.so
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ vars.ARTIFACT_GENERATION }}

      # The specific jvm action uses `uname -s` to determine which `jvm` make rule to call.
      # Because this workflow runs on ubuntu, we're using the generic action
      - name: download aarch64 apple darwin artifact
        uses: ./.github/actions/make
        with:
          key: jvm-darwin
          make-rule: jvm-darwin
          target-path: target/aarch64-apple-darwin/release/libcore_crypto_ffi.dylib
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ vars.ARTIFACT_GENERATION }}

      - name: download kotlin bindings
        uses: ./.github/actions/make/bindings-kotlin-jvm
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ vars.ARTIFACT_GENERATION }}

      - name: Run benchmark
        run: make jvm-bench

      - name: Upload benchmark result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-jvm-results
          path: crypto-ffi/bindings/jvm/build/reports/jmh/results.json

  publish:
    if: ${{ inputs.publish }}
    needs:
      - benchmark
    uses: ./.github/workflows/benchmark-jvm-publish.yml
    secrets:
      METRICS_WRITER_PASSWORD: ${{ secrets.METRICS_WRITER_PASSWORD }}
