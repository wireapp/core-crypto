name: prepare to publish kmp packages

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-prepare-publish-kmp"

on:
  workflow_call:
    inputs:
      artifact_generation:
        description: >
          Artifact key generation suffix, pinned by the caller so that every job in a run
          agrees on it. Falls back to `vars.ARTIFACT_GENERATION` when this workflow is
          invoked directly.
        required: false
        type: string
    secrets:
      PGP_KEY_ID:
        required: true
      PGP_SIGNING_KEY:
        required: true
      PGP_PASSPHRASE:
        required: true

env:
  RELEASE: 1

jobs:
  kmp:
    if: github.repository == 'wireapp/core-crypto'
    runs-on: macos-latest
    env:
      ORG_GRADLE_PROJECT_releaseBuild: "true"
      ORG_GRADLE_PROJECT_bindingsLibrary: ${{ github.workspace }}/target/release/libcore_crypto_ffi.dylib
      ORG_GRADLE_PROJECT_bindgen: ${{ github.workspace }}/target/oxikt/bin/uniffi-bindgen-kotlin-multiplatform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/make/setup

      - name: set up jdk 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 25
          distribution: temurin

      - name: gradle setup
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6.0'

      - name: fetch the bindgen
        uses: ./.github/actions/make/oxikt-bindgen
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}

      - name: download the libraries
        uses: ./.github/actions/make/kmp-libs
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}

      - name: stage artifacts for maven.wire.com
        uses: ./.github/actions/wire-maven/stage
        with:
          project: ":core-crypto-kmp"
          platform: kmp
          artifacts: |
            core-crypto-kmp
            core-crypto-kmp-android
            core-crypto-kmp-jvm
            core-crypto-kmp-iosarm64
            core-crypto-kmp-iossimulatorarm64
            core-crypto-kmp-macosarm64
          pgp-key-id: ${{ secrets.PGP_KEY_ID }}
          pgp-signing-key: ${{ secrets.PGP_SIGNING_KEY }}
          pgp-passphrase: ${{ secrets.PGP_PASSPHRASE }}
