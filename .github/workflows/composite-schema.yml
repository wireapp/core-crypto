name: composite-schema

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install compile-schema
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/wireapp/compile-schema/releases/latest/download/compile-schema-installer.sh | sh
      - name: check composite schema is up to date
        run: |
          generated=$(compile-schema keystore/src/connection/migrations)
          # -wB ignores all whitespace differences (within lines and whole blank lines).
          # Only non-whitespace diffs cause failure.
          if diff -uwB \
            --label generated/composite-schema.sql \
            --label checked-in/composite-schema.sql \
            <(echo "$generated") \
            keystore/src/connection/composite-schema.sql; then
            echo "composite-schema.sql is up to date"
          else
            echo "::error file=keystore/src/connection/composite-schema.sql,title=composite schema is stale::composite-schema.sql is out of date. Please regenerate it using the compile-schema tool: https://github.com/wireapp/compile-schema"
            exit 1
          fi
