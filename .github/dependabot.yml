version: 2
updates:
  - package-ecosystem: "cargo"
    rebase-strategy: "disabled"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 30
    cooldown:
      default-days: 7

  - package-ecosystem: "bun"
    rebase-strategy: "disabled"
    directory: "crypto-ffi/bindings/js"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "@types/bun"
        versions:
          # This bun version shipped the full rust rewrite
          - ">=1.4.0"
    groups:
      js-dependencies:
        patterns:
          - "*"

    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    rebase-strategy: "disabled"
    directories: # actions have to be listed explicitly
      - "/" # workflows
      - "/.github/actions/**/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "rust-toolchain"
    rebase-strategy: "disabled"
    directory: /
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
