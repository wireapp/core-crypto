concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-test-kmp-jvm"
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      artifact_generation:
        description: >
          Artifact key generation suffix, pinned by the caller so that every job in a run
          agrees on it. Falls back to `vars.ARTIFACT_GENERATION` when this workflow is
          invoked directly.
        required: false
        type: string
  workflow_dispatch:

# The libraries the jobs building them upload are release builds.
env:
  RELEASE: 1

jobs:
  test-jvm:
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
          - runs-on: [self-hosted, core-crypto]
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/make/setup

      - name: set up jdk 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 25
          distribution: temurin
      - name: gradle setup
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # Gradle only includes the KMP module with `ANDROID_HOME` set.
      - name: setup android sdk
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Don't download unnecessary packages.
          packages: ''

      - name: download the libraries
        uses: ./.github/actions/make/kmp-libs
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}

      - name: build and test kmp package
        uses: ./.github/actions/make
        with:
          key: kmp-jvm-test
          make-rule: kmp-jvm-test
          always-run: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}
