ignore.artifact-signing:
  comment: the crypto provider of the Gradle signing plugin - it signs the artifacts, it is not part of them
  entries:
    - "bc*-jdk18on"

ignore.cdxgen-version-catalog-misparse:
  comment: >-
    cdxgen mis-reads `version = { prefer = ... }` in a Gradle version catalog and emits
    the component with the literal version `{prefer`; the same components are read
    correctly from the catalog itself
  entries:
    - name: "*"
      version: "{prefer"
