name: prepare to publish kmp packages

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-prepare-publish-kmp"

on:
  workflow_call:
    inputs:
      artifact_generation:
        description: >
          Artifact key generation suffix, pinned by the caller so that every job in a run
          agrees on it. Falls back to `vars.ARTIFACT_GENERATION` when this workflow is
          invoked directly.
        required: false
        type: string
    secrets:
      PGP_KEY_ID:
        required: true
      PGP_SIGNING_KEY:
        required: true
      PGP_PASSPHRASE:
        required: true
    outputs:
      staging_repository_id:
        description: "Sonatype staging repository id created during the prepare phase."
        value: ${{ jobs.kmp.outputs.staging_repository_id }}

env:
  RELEASE: 1

jobs:
  kmp:
    if: github.repository == 'wireapp/core-crypto'
    runs-on: macos-latest
    permissions:
      id-token: write
    outputs:
      staging_repository_id: ${{ steps.stage.outputs.staging_repository_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/make/setup

      - name: set up jdk 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: gradle setup
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: download ffi library
        uses: ./.github/actions/make/ffi-library
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}

      - name: download armv7-linux-androideabi binaries
        uses: ./.github/actions/make/android/lib
        with:
          task: android-armv7
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}

      - name: download aarch64-linux-android binaries
        uses: ./.github/actions/make/android/lib
        with:
          task: android-armv8
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}

      - name: download x86_64-linux-android binaries
        uses: ./.github/actions/make/android/lib
        with:
          task: android-x86
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}

      - name: download artifacts for ios device
        uses: ./.github/actions/make/ios/build
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          task: ios-device
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}

      - name: download artifacts for ios simulator
        uses: ./.github/actions/make/ios/build
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          task: ios-simulator-arm
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}

      - name: download aarch64 apple darwin artifact
        uses: ./.github/actions/make/jvm
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}

      # The specific jvm action uses `uname -s` to determine which `jvm` make rule to call.
      # Because this workflow runs on macOS, we're using the generic action
      - name: download x86_64 linux artifact
        uses: ./.github/actions/make
        with:
          key: jvm-linux
          make-rule: jvm-linux
          target-path: target/x86_64-unknown-linux-gnu/release/libcore_crypto_ffi.a
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}

      - name: configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::093205192929:role/gh-actions-maven-publish-core-crypto
          aws-region: us-east-1

      - name: publish to local maven
        id: publish
        working-directory: crypto-ffi/bindings
        run: |
          ./gradlew :core-crypto-kmp:publishMavenPublicationToWireMavenRepository -PskipSigning=true

      - name: sync to S3
        id: stage
        run: |
          VERSION=$(sed -n 's/^VERSION_NAME=//p' crypto-ffi/bindings/gradle.properties)
          ARTIFACT_ID=core-crypto-kmp
          GROUP="com.wire"
          
          echo "Publishing ${GROUP}/${ARTIFACT_ID}/${VERSION} to s3://maven-wire-com"

          local_s3_path="s3://maven-wire-com/${GROUP//./$'/'}${ARTIFACT_ID}/${VERSION}/"
          aws s3 sync "crypto-ffi/bindings/kmp/build/maven-publish" "$local_s3_path" --no-progress

          # Extract the maven-metadata.xml from the published version directory
          local_metadata=$(find crypto-ffi/bindings/kmp/build/maven-publish -name "maven-metadata.xml" | head -n1)
          if [ -n "$local_metadata" ]; then
            meta_path="s3://maven-wire-com/${GROUP//./$'/'}${ARTIFACT_ID}/"
            echo "Uploading maven-metadata.xml to ${meta_path}"
            aws s3 cp "$local_metadata" "${meta_path}"
          fi

          echo "staging_repository_id=kmp" >> "$GITHUB_OUTPUT"
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.PGP_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.PGP_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.PGP_PASSPHRASE }}
