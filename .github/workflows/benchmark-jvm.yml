concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-benchmark-jvm"
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      artifact_generation:
        description: >
          Artifact key generation suffix, pinned by the caller so that every job in a run
          agrees on it. Falls back to `vars.ARTIFACT_GENERATION` when this workflow is
          invoked directly.
        required: false
        type: string
      benchmark_message_counts:
        required: false
        type: string
      benchmark_message_sizes:
        required: false
        type: string
      benchmark_user_counts:
        required: false
        type: string
      benchmark_cipher_suites:
        required: false
        type: string
      publish:
        required: false
        type: boolean
        default: true
      runs_on:
        description: JSON string or array to use for the benchmark runner
        required: false
        type: string
        default: '"ubuntu-latest"'
    secrets:
      METRICS_WRITER_PASSWORD:
        description: Password for the metrics writer used to publish to Prometheus
        required: false
  workflow_dispatch:
    inputs:
      benchmark_message_counts:
        description: Comma-separated benchmark message counts
        required: false
        type: string
      benchmark_message_sizes:
        description: Comma-separated benchmark message sizes
        required: false
        type: string
      benchmark_user_counts:
        description: Comma-separated benchmark user counts
        required: false
        type: string
      benchmark_cipher_suites:
        description: Comma-separated benchmark cipher suite names
        required: false
        type: string
      publish:
        description: Publish benchmark results
        required: false
        type: boolean
        default: true
      runs_on:
        description: JSON string or array to use for the benchmark runner
        required: false
        type: string
        default: '"ubuntu-latest"'

env:
  RELEASE: 1

permissions:
  # deployments permission to deploy GitHub pages website
  deployments: write
  # contents permission to update benchmark contents in gh-pages branch
  contents: write

jobs:
  benchmark:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    env:
      BENCHMARK_MESSAGE_COUNTS: ${{ inputs.benchmark_message_counts }}
      BENCHMARK_MESSAGE_SIZES: ${{ inputs.benchmark_message_sizes }}
      BENCHMARK_USER_COUNTS: ${{ inputs.benchmark_user_counts }}
      BENCHMARK_CIPHER_SUITES: ${{ inputs.benchmark_cipher_suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/make/setup

      - name: set up jdk 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
      - name: gradle setup
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: download jvm library for this runner
        uses: ./.github/actions/make/jvm
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}

      - name: download kotlin bindings
        uses: ./.github/actions/make/bindings-kotlin-jvm
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}

      - name: Run benchmark
        run: make jvm-bench

      - name: Upload benchmark result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-jvm-results
          path: crypto-ffi/bindings/jvm/build/reports/jmh/results.json

  publish:
    if: ${{ inputs.publish }}
    needs:
      - benchmark
    uses: ./.github/workflows/benchmark-jvm-publish.yml
    secrets:
      METRICS_WRITER_PASSWORD: ${{ secrets.METRICS_WRITER_PASSWORD }}
