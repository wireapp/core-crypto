name: prepare to publish android packages

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-prepare-publish-android"

on:
  workflow_call:
    inputs:
      artifact_generation:
        description: >
          Artifact key generation suffix, pinned by the caller so that every job in a run
          agrees on it. Falls back to `vars.ARTIFACT_GENERATION` when this workflow is
          invoked directly.
        required: false
        type: string
    secrets:
      SONATYPE_USERNAME:
        required: true
      SONATYPE_PASSWORD:
        required: true
      PGP_KEY_ID:
        required: true
      PGP_SIGNING_KEY:
        required: true
      PGP_PASSPHRASE:
        required: true
    outputs:
      staging_repository_id:
        description: "The Sonatype staging repository id created during the prepare phase."
        value: ${{ jobs.android.outputs.staging_repository_id }}

env:
  RELEASE: 1

jobs:
  android:
    if: github.repository == 'wireapp/core-crypto'
    runs-on: ubuntu-latest
    outputs:
      staging_repository_id: ${{ steps.stage.outputs.staging_repository_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/make/setup

      - name: set up jdk 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: gradle setup
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      # We don't use the default packages here as setup-android is currently broken due to google not serving tools
      # anymore, see https://github.com/android-actions/setup-android/issues/537
      - name: setup android sdk
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools'

      - name: download android package
        uses: ./.github/actions/make/android/package
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ inputs.artifact_generation || vars.ARTIFACT_GENERATION }}

      - name: stage artifact in sonatype
        id: stage
        uses: ./.github/actions/sonatype/stage
        with:
          project: ":android"
          label: Android
          sonatype-username: ${{ secrets.SONATYPE_USERNAME }}
          sonatype-password: ${{ secrets.SONATYPE_PASSWORD }}
          pgp-key-id: ${{ secrets.PGP_KEY_ID }}
          pgp-signing-key: ${{ secrets.PGP_SIGNING_KEY }}
          pgp-passphrase: ${{ secrets.PGP_PASSPHRASE }}
