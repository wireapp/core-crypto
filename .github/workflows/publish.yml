name: publish packages (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.2.3)"
        required: true
        type: string
      registry:
        description: "Which registry to publish to"
        required: false
        type: choice
        default: all
        options:
          - all
          - npm
          - jvm
          - android
          - kmp

env:
  RELEASE: 1

jobs:
  # Pin the artifact key generation for the whole run; see `artifact-generation.yml`.
  artifact-generation:
    uses: ./.github/workflows/artifact-generation.yml

  publish-jvm:
    if: inputs.registry == 'all' || inputs.registry == 'jvm'
    needs: artifact-generation
    uses: ./.github/workflows/prepare-publish-jvm.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}
    secrets:
      PGP_KEY_ID: ${{ secrets.PGP_KEY_ID }}
      PGP_SIGNING_KEY: ${{ secrets.PGP_SIGNING_KEY }}
      PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

  publish-android:
    if: inputs.registry == 'all' || inputs.registry == 'android'
    needs: artifact-generation
    uses: ./.github/workflows/prepare-publish-android.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}
    secrets:
      PGP_KEY_ID: ${{ secrets.PGP_KEY_ID }}
      PGP_SIGNING_KEY: ${{ secrets.PGP_SIGNING_KEY }}
      PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

  publish-kmp:
    if: inputs.registry == 'all' || inputs.registry == 'kmp'
    needs: artifact-generation
    uses: ./.github/workflows/prepare-publish-kmp.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}
    secrets:
      PGP_KEY_ID: ${{ secrets.PGP_KEY_ID }}
      PGP_SIGNING_KEY: ${{ secrets.PGP_SIGNING_KEY }}
      PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

  publish-npm:
    # The npm tarballs are uploaded to the GH release during the automatic pipeline run.
    # Each present tarball means "not yet published"; we publish then delete it.
    # Absent tarballs were already published or never uploaded — skip them.
    if: inputs.registry == 'all' || inputs.registry == 'npm'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download npm tarballs from release
        id: download
        run: |
          mkdir -p npm-tarballs
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if ! grep -Eq '^wireapp-core-crypto(-native)?-.*\.tgz$' <<< "$assets"; then
            echo "No npm tarball found in release '$TAG' — already published or never uploaded"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            gh release download "$TAG" --pattern "wireapp-core-crypto-*.tgz" --dir npm-tarballs
          fi
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}

      - name: set up node
        if: steps.download.outputs.found == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

      - name: publish to npm (Trusted Publishers)
        if: steps.download.outputs.found == 'true'
        run: |
          tag='latest'
          # Special handling of pre-releases
          if [[ "$TAG" == v*-* ]]; then
            label="${TAG#*-}"
            tag="${label%%.*}"
          fi
          for tarball in npm-tarballs/*.tgz; do
            npm publish "$tarball" --tag "$tag"
            gh release delete-asset "$TAG" "${tarball##*/}" --yes
          done
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
