name: 🚀 pipeline

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RELEASE: 1

jobs:
  # Every `make` artifact key is suffixed with `vars.ARTIFACT_GENERATION`. Resolve that variable
  # once per run and hand the value to every other job through `needs`, so that producers and
  # consumers can never disagree about it. See `artifact-generation.yml` for why that matters.
  artifact-generation:
    uses: ./.github/workflows/artifact-generation.yml

  #################
  # Shared between JVM Linux and Android

  uniffi-bindgen-linux:
    needs: artifact-generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/make/setup
      - uses: ./.github/actions/make/uniffi-bindgen
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ needs.artifact-generation.outputs.generation }}

  ffi-library-linux:
    needs: artifact-generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/make/setup
      - uses: ./.github/actions/make/ffi-library
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ needs.artifact-generation.outputs.generation }}

  ffi-library-macos:
    needs: artifact-generation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/make/setup
      - uses: ./.github/actions/make/ffi-library
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ needs.artifact-generation.outputs.generation }}

  #################
  # Android

  build-android:
    needs: artifact-generation
    uses: ./.github/workflows/build-android.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  bindings-android:
    runs-on: ubuntu-latest
    needs:
      - artifact-generation
      - uniffi-bindgen-linux
      - ffi-library-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/make/setup
      - uses: ./.github/actions/make/android/bindings
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ needs.artifact-generation.outputs.generation }}

  package-android:
    needs:
      - artifact-generation
      - bindings-android
      - build-android
    uses: ./.github/workflows/package-android.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  test-android:
    needs:
      - artifact-generation
      - bindings-android
      - build-android
    uses: ./.github/workflows/test-android.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  #################
  # JVM Darwin

  build-jvm-darwin:
    needs: artifact-generation
    if: github.repository == 'wireapp/core-crypto'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/make/setup
      - uses: ./.github/actions/make/jvm
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ needs.artifact-generation.outputs.generation }}

  #################
  # JVM Linux

  build-jvm-linux:
    needs: artifact-generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/make/setup
      - uses: ./.github/actions/make/jvm
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ needs.artifact-generation.outputs.generation }}

  bindings-jvm:
    needs:
      - artifact-generation
      - uniffi-bindgen-linux
      - ffi-library-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/make/setup
      - uses: ./.github/actions/make/bindings-kotlin-jvm
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ needs.artifact-generation.outputs.generation }}

  test-jvm:
    needs:
      - artifact-generation
      - bindings-jvm
      - build-jvm-linux
      - build-jvm-darwin
    uses: ./.github/workflows/test-jvm.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  check-kotlin:
    needs:
      - artifact-generation
      - bindings-jvm
      - build-jvm-linux
      - build-jvm-darwin
    uses: ./.github/workflows/kotlin-check.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  docs-jvm:
    needs:
      - artifact-generation
      - bindings-jvm
      - build-jvm-linux
    uses: ./.github/workflows/docs-jvm.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  check-benchmark-jvm:
    needs:
      - artifact-generation
      - bindings-jvm
      - build-jvm-linux
      - build-jvm-darwin
    uses: ./.github/workflows/benchmark-jvm.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}
      publish: false
      benchmark_message_counts: "1"
      benchmark_message_sizes: "16"
      benchmark_user_counts: "1"
      benchmark_cipher_suites: "1"

  #################
  # KMP

  test-kmp:
    needs:
      - artifact-generation
      - ffi-library-linux
      - ffi-library-macos
      - build-jvm-linux
      - build-jvm-darwin
    uses: ./.github/workflows/test-kmp.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  #################
  # iOS/Swift

  build-ios:
    needs: artifact-generation
    uses: ./.github/workflows/build-ios.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  bindings-swift:
    needs:
      - artifact-generation
      - ffi-library-macos
    if: github.repository == 'wireapp/core-crypto'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/make/setup
      - uses: ./.github/actions/make/bindings-swift
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ needs.artifact-generation.outputs.generation }}

  package-ios:
    needs:
      - artifact-generation
      - build-ios
      - bindings-swift
    uses: ./.github/workflows/package-ios.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  test-ios:
    needs:
      - artifact-generation
      - build-ios
      - bindings-swift
    uses: ./.github/workflows/test-ios.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  docs-swift:
    needs:
      - artifact-generation
      - build-ios
      - bindings-swift
    uses: ./.github/workflows/docs-swift.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  #################
  # Web

  bindings-ts-browser:
    needs: artifact-generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/make/setup
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: build ts
        uses: ./.github/actions/make/ts/browser
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ needs.artifact-generation.outputs.generation }}

  bindings-ts-native-linux:
    needs: artifact-generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/make/setup
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: build ts
        uses: ./.github/actions/make/ts/native
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ needs.artifact-generation.outputs.generation }}

  bindings-ts-native-darwin:
    needs: artifact-generation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/make/setup
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: build ts
        uses: ./.github/actions/make/ts/native
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ needs.artifact-generation.outputs.generation }}

  test-ts-browser:
    needs:
      - artifact-generation
      - bindings-ts-browser
    uses: ./.github/workflows/test-ts-browser.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  test-ts-native:
    needs:
      - artifact-generation
      - bindings-ts-native-linux
    uses: ./.github/workflows/test-ts-native.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  check-ts:
    needs:
      - artifact-generation
      - bindings-ts-browser
      - bindings-ts-native-linux
    uses: ./.github/workflows/check-ts.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  docs-ts:
    needs:
      - artifact-generation
      - bindings-ts-browser
      - bindings-ts-native-linux
    uses: ./.github/workflows/docs-ts.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  check-benchmark-ts-browser:
    needs:
      - artifact-generation
      - bindings-ts-browser
    uses: ./.github/workflows/benchmark-ts-browser.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}
      publish: false
      benchmark_message_counts: "1"
      benchmark_message_sizes: "16"
      benchmark_user_counts: "1"
      benchmark_cipher_suites: "1"

  check-benchmark-ts-native:
    needs:
      - artifact-generation
      - bindings-ts-native-linux
    uses: ./.github/workflows/benchmark-ts-native.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}
      publish: false
      benchmark_message_counts: "1"
      benchmark_message_sizes: "16"
      benchmark_user_counts: "1"
      benchmark_cipher_suites: "1"

  #################
  # Rust

  docs-cc-book:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/docs-cc-book.yml

  docs-rust:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-and-cache-rust
      - run: cargo doc --all --no-deps --locked

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust
          path: target/doc
          retention-days: 1
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error

  #################
  # Cross-platform jobs

  build-interop:
    needs: artifact-generation
    if: github.repository == 'wireapp/core-crypto'
    runs-on: macos-latest
    steps:
      # Needed for parity between github and self-hosted runner
      - run: brew install make
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/make/setup
      - uses: ./.github/actions/make/interop/build
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-generation: ${{ needs.artifact-generation.outputs.generation }}

  e2e-interop-test:
    needs:
      - artifact-generation
      - build-ios
      - bindings-swift
      - bindings-ts-browser
      - bindings-android
      - build-android
      - build-interop
    uses: ./.github/workflows/interop.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  deploy-docs:
    needs:
      - docs-cc-book
      - docs-rust
      - docs-ts
      - docs-jvm
      - docs-swift
    uses: ./.github/workflows/deploy-docs.yml

  #################
  # Publish

  prepare-publish:
    needs:
      - artifact-generation
      - package-ios
      - package-android
      - bindings-ts-browser
      - bindings-ts-native-linux
      - bindings-ts-native-darwin
      - build-jvm-linux
      - build-jvm-darwin
      - bindings-jvm
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/prepare-publish.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}
    secrets:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      PGP_KEY_ID: ${{ secrets.PGP_KEY_ID }}
      PGP_SIGNING_KEY: ${{ secrets.PGP_SIGNING_KEY }}
      PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

  publish-jvm:
    needs: prepare-publish
    if: github.repository == 'wireapp/core-crypto'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: release artifact
        uses: ./.github/actions/sonatype/release
        with:
          staging-repository-id: ${{ needs.prepare-publish.outputs.jvm_staging_repository_id }}
          sonatype-username: ${{ secrets.SONATYPE_USERNAME }}
          sonatype-password: ${{ secrets.SONATYPE_PASSWORD }}
          pgp-key-id: ${{ secrets.PGP_KEY_ID }}
          pgp-signing-key: ${{ secrets.PGP_SIGNING_KEY }}
          pgp-passphrase: ${{ secrets.PGP_PASSPHRASE }}

  publish-android:
    needs: prepare-publish
    if: github.repository == 'wireapp/core-crypto'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: release artifact
        uses: ./.github/actions/sonatype/release
        with:
          staging-repository-id: ${{ needs.prepare-publish.outputs.android_staging_repository_id }}
          sonatype-username: ${{ secrets.SONATYPE_USERNAME }}
          sonatype-password: ${{ secrets.SONATYPE_PASSWORD }}
          pgp-key-id: ${{ secrets.PGP_KEY_ID }}
          pgp-signing-key: ${{ secrets.PGP_SIGNING_KEY }}
          pgp-passphrase: ${{ secrets.PGP_PASSPHRASE }}

  publish-kmp:
    needs: prepare-publish
    if: github.repository == 'wireapp/core-crypto'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: release artifact
        uses: ./.github/actions/sonatype/release
        with:
          staging-repository-id: ${{ needs.prepare-publish.outputs.kmp_staging_repository_id }}
          sonatype-username: ${{ secrets.SONATYPE_USERNAME }}
          sonatype-password: ${{ secrets.SONATYPE_PASSWORD }}
          pgp-key-id: ${{ secrets.PGP_KEY_ID }}
          pgp-signing-key: ${{ secrets.PGP_SIGNING_KEY }}
          pgp-passphrase: ${{ secrets.PGP_PASSPHRASE }}

  publish-ios:
    needs:
      - prepare-publish
      - artifact-generation
    uses: ./.github/workflows/publish-swift.yml
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}

  publish-npm:
    needs:
      - prepare-publish
      - artifact-generation
    uses: ./.github/workflows/publish-npm.yml
    permissions:
      id-token: write
      contents: write
    with:
      artifact_generation: ${{ needs.artifact-generation.outputs.generation }}
      release: true
