# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
kotlin.build.archivesTaskOutputAsFriendModule=false

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":

# Enable Dokka 2.0
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled

# Allow all native targets to share the same bindings code

# Give test compilations access to `internal` declarations via the main classes directory,
# not the main jar. Otherwise compiling tests builds the jar, and the jvm jar needs the
# native libraries for every platform (see `jvm/build.gradle.kts`).

# Maven publication
