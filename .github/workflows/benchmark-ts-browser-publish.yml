concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-benchmark-ts-browser-publish"
  cancel-in-progress: true

on:
  workflow_call:
    secrets:
      METRICS_WRITER_PASSWORD:
        description: Password for the metrics writer used to publish to Prometheus
        required: true

permissions:
  deployments: write
  contents: write

jobs:
  publish:
    name: Publish benchmark result
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download benchmark result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-ts-browser-results

      - name: Publish benchmark result to Prometheus
        env:
          VM_PASSWORD: ${{ secrets.METRICS_WRITER_PASSWORD }}
        run: |
          scripts/benchmarks-to-openmetrics.py --format tinybench benches_result.json > metrics.txt
          COMMIT_HASH=$(git rev-parse --short HEAD)
          curl -sS --fail-with-body -u "ci-writer:$VM_PASSWORD" --data-binary @metrics.txt \
               --url-query extra_label=job=core-crypto-benchmark \
               --url-query extra_label=repo=$GITHUB_REPOSITORY \
               --url-query extra_label=commit=$COMMIT_HASH \
               --url-query extra_label=target=ts-browser \
              "https://monitoring.zinfra.io/prometheus/api/v1/import/prometheus?"

      - name: Publish benchmark result to GitHub pages
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: "Browser Benchmarks"
          tool: 'customBiggerIsBetter'
          output-file-path: benches_result.json
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
