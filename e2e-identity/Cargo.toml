[package]
name = "wire-e2e-identity"
description = "Public API for Wire end to end identity"
version = "0.13.0"
edition = "2024"
repository = "https://github.com/wireapp/rusty-jwt-tools"
license = "MPL-2.0"
publish = false

[lints]
workspace = true

[dependencies]
# TODO: we depend on the whole keystore crate, but actually
# only need keystore traits. Once keystore traits are moved
# to a standalone crate, we can replace this dependency.
# See WPB-23172.
core-crypto-keystore.workspace = true

obfuscate.workspace = true
core-crypto-macros.workspace = true
async-trait.workspace = true
async-lock.workspace = true
spki.workspace = true
openmls_traits.workspace = true
rusty-jwt-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jwt-simple.workspace = true
derive_more = { workspace = true, features = ["deref", "from", "into"] }
url.workspace = true
zeroize.workspace = true
uuid = { workspace = true, features = ["serde"] }
x509-cert = { workspace = true, features = ["builder"] }
time = { workspace = true, features = [
  "serde",
  "serde-well-known",
  "wasm-bindgen",
] }
ed25519-dalek.workspace = true
signature.workspace = true
log.workspace = true
p256.workspace = true
p384.workspace = true
p521.workspace = true
pem.workspace = true
web-time.workspace = true
hex.workspace = true
certval.workspace = true
# We require a pre-release version of x509-ocsp because certval depends on it.
# Once x509-ocsp 0.3 is released and certval moves to it, remove this explicit
# dependency.
x509-ocsp = { git = "https://github.com/RustCrypto/formats.git", package = "x509-ocsp", version = "0.3.0-pre" }
der.workspace = true
const-oid.workspace = true
base64.workspace = true

[dev-dependencies]
argon2 = "0.6"
password-hash = { version = "0.6", features = ["getrandom"] }
env_logger.workspace = true
rusty-jwt-tools = { workspace = true, features = ["test-utils", "rsa"] }
url.workspace = true
itertools.workspace = true
uuid.workspace = true
hex.workspace = true
shlex = "2"

openidconnect.workspace = true
scraper.workspace = true
tokio = { workspace = true, features = ["macros"] }
pem.workspace = true
rand.workspace = true
rstest.workspace = true

[target.'cfg(not(target_os = "unknown"))'.dev-dependencies]
reqwest = { workspace = true, features = ["json", "cookies"] }
oauth2.workspace = true
http.workspace = true
keycloak.workspace = true
testcontainers = { workspace = true, features = ["reusable-containers"] }

[target.'cfg(target_os = "unknown")'.dependencies.uuid]
workspace = true
features = ["std", "js"]

[features]
default = []
