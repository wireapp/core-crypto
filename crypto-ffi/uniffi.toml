[bindings.kotlin]
package_name = "com.wire.crypto"
cdylib_name = "core_crypto_ffi"

[bindings.kotlin.custom_types.Timestamp]
imports = [
  "kotlin.time.Instant",
  "kotlin.time.toKotlinInstant",
  "kotlin.time.toJavaInstant",
]
type_name = "Instant"
lift = "{}.toKotlinInstant()"
lower = "{}.toJavaInstant()"

[bindings.swift]
cdylib_name = "core_crypto_ffi"
ffi_module_name = "LibCoreCrypto"
ffi_module_filename = "core_crypto_ffiFFI"
generate_module_map = false

[bindings.typescript]
strictObjectTypes = true
strictByteArrays = true

# Enable JSPI by default so that new synchronous calls, or async calls later made synchronous, can still reach OPFS.
# Exclude the existing synchronous API that cannot reach OPFS.
jspi = { exclude = [
  "buildMetadata",
  "cipherSuiteDefault",
  "cipherSuiteFromU16",
  "proteusFingerprintPrekeybundleFfi",
  "proteusLastResortPrekeyIdFfi",
  "setLogger",
  "setMaxLogLevel",
  "version",
  "Welcome",
  "ClientId",
  "Uuid",
  "DeviceId",
  "DeserializedClientId",
  "ConversationId",
  "KeyPackageRef",
  "KeyPackage",
  "Credential",
  "CredentialRef",
  "ExternalSender",
  "SecretKey",
  "GroupInfo",
  "DatabaseKey",
  "CoreCryptoFfi.constructor",
  "coreCryptoNew",
  "X509CredentialAcquisition.constructor",
  "X509CredentialAcquisition.fromBytes",
] }
