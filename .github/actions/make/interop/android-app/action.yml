name: Fetch or make the Android interop app
description: Fetch or build the Android interop app, fetching or building the ffi libraries for all three Android targets and the Kotlin bindings it bundles
inputs:
  gh-token:
    required: true
  artifact-generation:
    description: suffix for artifact names that allows us to easily invalidate artifacts

runs:
  using: composite
  steps:
    - name: download armv7-linux-androideabi binaries
      uses: ./.github/actions/make/android/lib
      with:
        task: android-armv7
        gh-token: ${{ inputs.gh-token }}
        artifact-generation: ${{ inputs.artifact-generation }}

    - name: download aarch64-linux-android binaries
      uses: ./.github/actions/make/android/lib
      with:
        task: android-armv8
        gh-token: ${{ inputs.gh-token }}
        artifact-generation: ${{ inputs.artifact-generation }}

    - name: download x86_64-linux-android binaries
      uses: ./.github/actions/make/android/lib
      with:
        task: android-x86
        gh-token: ${{ inputs.gh-token }}
        artifact-generation: ${{ inputs.artifact-generation }}

    - name: download android bindings
      uses: ./.github/actions/make/android/bindings
      with:
        gh-token: ${{ inputs.gh-token }}
        artifact-generation: ${{ inputs.artifact-generation }}

    - uses: ./.github/actions/make
      with:
        key: interop-android-app
        make-rule: interop-android-app
        target-path: interop/src/clients/android-interop/build/outputs/apk/release/android-interop-release.apk
        gh-token: ${{ inputs.gh-token }}
        artifact-generation: ${{ inputs.artifact-generation }}
