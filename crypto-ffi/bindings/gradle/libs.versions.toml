[versions]
kotlin = "2.4.0"
coroutines = "1.7.3"
kotlinx-datetime = "0.7.1"
jna = "5.17.0"
assertj = "3.24.2"
espresso = "3.6.1"
android-junit = "1.2.1"
android-tools = "9.3.1"
sdk-compile = "37"
sdk-min = "26"
gradle = "9.7.0"
dokka = "2.2.0"
detekt = "2.0.0-alpha.3"
agp = "9.3.1"
ubique-uniffi = "1.3.2"

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ubique-uniffi = { id = "ch.ubique.uniffi.plugin", version.ref = "ubique-uniffi" }

[libraries]
coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "coroutines" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
android-junit = { module = "androidx.test.ext:junit", version.ref = "android-junit" }
android-tools = { module = "com.android.tools.build:gradle", version.ref = "android-tools" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
