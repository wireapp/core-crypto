[package]
name = "keystore-opfs-recovery"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
core-crypto-keystore = { path = "../../keystore", features = [
  "opfs-recovery-fixture",
] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
